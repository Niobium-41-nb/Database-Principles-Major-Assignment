<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表 - 在线判题系统</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .user-list { display: grid; gap: 1rem; }
        .user-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1.5rem; display: flex; align-items: center; transition: all 0.3s ease; }
        .user-item:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; background: #3498db; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; margin-right: 1rem; }
        .user-info { flex: 1; }
        .user-handle { font-size: 1.25rem; font-weight: bold; color: #2c3e50; margin: 0 0 0.5rem 0; }
        .user-meta { display: flex; gap: 1rem; flex-wrap: wrap; }
        .meta-item { display: flex; flex-direction: column; }
        .meta-label { font-size: 0.875rem; color: #666; margin-bottom: 0.25rem; }
        .meta-value { font-weight: 500; }
        .user-rating { font-size: 1.1rem; font-weight: bold; text-align: right; min-width: 100px; }
        .rating-high { color: #e74c3c; }
        .rating-medium { color: #e67e22; }
        .rating-low { color: #27ae60; }
        .user-rank { background: #34495e; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.875rem; margin-left: 0.5rem; }
        .search-box { margin-bottom: 1rem; }
        .search-input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        .filters { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-select { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; background: white; }
        .admin-badge { background: #e74c3c; color: white; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.75rem; margin-left: 0.5rem; }
        .user-actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
        .btn { padding: 0.3rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; }
        .btn-admin { background: #3498db; color: white; }
        .btn-remove-admin { background: #e74c3c; color: white; }
        .btn:hover { opacity: 0.8; }
        .admin-section { display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>用户列表</h2>

            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="搜索用户..." onkeyup="filterUsers()">
            </div>

            <div class="filters">
                <select id="rank-filter" class="filter-select" onchange="filterUsers()">
                    <option value="">所有等级</option>
                    <option value="Newbie">Newbie</option>
                    <option value="Pupil">Pupil</option>
                    <option value="Specialist">Specialist</option>
                    <option value="Expert">Expert</option>
                    <option value="Candidate Master">Candidate Master</option>
                    <option value="Master">Master</option>
                    <option value="International Master">International Master</option>
                    <option value="Grandmaster">Grandmaster</option>
                </select>

                <select id="rating-filter" class="filter-select" onchange="filterUsers()">
                    <option value="">所有评分</option>
                    <option value="0-1199">0-1199</option>
                    <option value="1200-1399">1200-1399</option>
                    <option value="1400-1599">1400-1599</option>
                    <option value="1600-1899">1600-1899</option>
                    <option value="1900-2399">1900-2399</option>
                    <option value="2400+">2400+</option>
                </select>

                <select id="sort-filter" class="filter-select" onchange="sortUsers()">
                    <option value="rating-desc">评分降序</option>
                    <option value="rating-asc">评分升序</option>
                    <option value="registration-desc">注册时间降序</option>
                    <option value="registration-asc">注册时间升序</option>
                </select>

                <select id="admin-filter" class="filter-select" onchange="filterUsers()">
                    <option value="">所有用户</option>
                    <option value="admin">仅管理员</option>
                    <option value="non-admin">非管理员</option>
                </select>
            </div>

            <div id="users-list" class="user-list">
                <!-- 用户数据将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/users.js"></script>
</body>
</html>
