<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建题目 - 在线判题系统</title>
    <link rel="stylesheet" href="css/create_problem.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <div id="auth-buttons">
                    <div id="user-info" style="display: none;">
                        <span id="user-handle" style="color: white; margin-right: 1rem;"></span>
                        <a href="/profile" style="color: white; text-decoration: none; margin-right: 1rem;">个人资料</a>
                        <button onclick="logout()" style="background: #e74c3c; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer;">登出</button>
                    </div>
                    <div id="guest-buttons">
                        <button onclick="showLogin()">登录</button>
                        <button onclick="showRegister()">注册</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>创建题目</h2>
            <form id="create-problem-form">
                <div class="form-group">
                    <label for="problem-id">题目ID *</label>
                    <input type="text" id="problem-id" name="problem_id" required>
                    <div class="error" id="problem-id-error"></div>
                </div>

                <div class="form-group">
                    <label for="title">题目标题 *</label>
                    <input type="text" id="title" name="title" required>
                    <div class="error" id="title-error"></div>
                </div>

                <div class="form-group">
                    <label for="statement">题目描述 *</label>
                    <textarea id="statement" name="statement" required></textarea>
                    <div class="error" id="statement-error"></div>
                </div>

                <div class="form-group">
                    <label for="input-specification">输入格式</label>
                    <textarea id="input-specification" name="input_specification"></textarea>
                </div>

                <div class="form-group">
                    <label for="output-specification">输出格式</label>
                    <textarea id="output-specification" name="output_specification"></textarea>
                </div>

                <div class="form-group">
                    <label for="time-limit">时间限制 (ms) *</label>
                    <input type="number" id="time-limit" name="time_limit" value="1000" min="100" required>
                    <div class="error" id="time-limit-error"></div>
                </div>

                <div class="form-group">
                    <label for="memory-limit">内存限制 (KB) *</label>
                    <input type="number" id="memory-limit" name="memory_limit" value="256000" min="1000" required>
                    <div class="error" id="memory-limit-error"></div>
                </div>

                <div class="form-group">
                    <label for="difficulty">难度</label>
                    <select id="difficulty" name="difficulty">
                        <option value="简单">简单</option>
                        <option value="中等">中等</option>
                        <option value="困难">困难</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>标签</label>
                    <div class="tag-input">
                        <input type="text" id="tag-input" placeholder="输入标签">
                        <button type="button" class="btn" onclick="addTag()">添加</button>
                    </div>
                    <div class="tags-container" id="tags-container"></div>
                    <input type="hidden" id="tags" name="tags">
                </div>

                <div class="form-group">
                    <label>测试用例</label>
                    <div id="test-cases">
                        <div class="test-case">
                            <div class="test-case-header">
                                <span>测试用例 #1</span>
                                <button type="button" class="btn btn-secondary" onclick="removeTestCase(this)">删除</button>
                            </div>
                            <label>输入</label>
                            <textarea name="test_input" placeholder="输入数据"></textarea>
                            <label>期望输出</label>
                            <textarea name="test_output" placeholder="期望输出"></textarea>
                            <label>
                                <input type="checkbox" name="is_sample"> 作为样例显示
                            </label>
                        </div>
                    </div>
                    <button type="button" class="btn" onclick="addTestCase()">添加测试用例</button>
                </div>

                <div class="form-group">
                    <label for="notes">备注</label>
                    <textarea id="notes" name="notes"></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn">创建题目</button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/problems'">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div id="login-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);">
        <div style="background: white; width: 300px; margin: 100px auto; padding: 2rem; border-radius: 8px;">
            <h3>登录</h3>
            <input type="text" id="login-handle" placeholder="用户名" style="width: 100%; margin: 0.5rem 0; padding: 0.5rem;">
            <input type="password" id="login-password" placeholder="密码" style="width: 100%; margin: 0.5rem 0; padding: 0.5rem;">
            <button onclick="login()" class="btn">登录</button>
            <button onclick="hideLogin()" class="btn" style="background: #95a5a6;">取消</button>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div id="register-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);">
        <div style="background: white; width: 300px; margin: 100px auto; padding: 2rem; border-radius: 8px;">
            <h3>注册</h3>
            <input type="text" id="register-handle" placeholder="用户名" style="width: 100%; margin: 0.5rem 0; padding: 0.5rem;">
            <input type="email" id="register-email" placeholder="邮箱" style="width: 100%; margin: 0.5rem 0; padding: 0.5rem;">
            <input type="text" id="register-name" placeholder="姓名（可选）" style="width: 100%; margin: 0.5rem 0; padding: 0.5rem;">
            <input type="password" id="register-password" placeholder="密码" style="width: 100%; margin: 0.5rem 0; padding: 0.5rem;">
            <button onclick="register()" class="btn">注册</button>
            <button onclick="hideRegister()" class="btn" style="background: #95a5a6;">取消</button>
        </div>
    </div>

    <script src="js/create_problem.js"></script>
</body>
</html>
