<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 在线判题系统</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/profile.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="login-prompt" class="card" style="display: none;">
            <h2>请先登录</h2>
            <p>您需要登录后才能查看和修改个人资料。</p>
            <button onclick="location.href='/'" class="btn">返回首页</button>
        </div>

        <div id="profile-content" style="display: none;">
            <div class="card">
                <div class="profile-header">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-info">
                        <h1 id="user-handle">用户名</h1>
                        <div id="user-rating" class="rating-low">0</div>
                    </div>
                </div>

                <div class="user-meta" id="user-meta">
                    <!-- 用户信息将通过JavaScript动态加载 -->
                </div>
            </div>

            <div class="tab-container">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('edit-profile')">编辑资料</div>
                    <div class="tab" onclick="switchTab('change-password')">修改密码</div>
                </div>

                <div id="edit-profile" class="tab-content active">
                    <div class="card">
                        <h2 class="section-title">编辑个人资料</h2>
                        <div id="profile-message"></div>
                        <form id="profile-form">
                            <div class="form-group">
                                <label class="form-label">姓名</label>
                                <input type="text" id="name" class="form-input" placeholder="请输入您的姓名">
                            </div>
                            <div class="form-group">
                                <label class="form-label">国家</label>
                                <input type="text" id="country" class="form-input" placeholder="请输入您的国家">
                            </div>
                            <div class="form-group">
                                <label class="form-label">城市</label>
                                <input type="text" id="city" class="form-input" placeholder="请输入您的城市">
                            </div>
                            <div class="form-group">
                                <label class="form-label">组织/学校</label>
                                <input type="text" id="organization" class="form-input" placeholder="请输入您的组织或学校">
                            </div>
                            <div class="form-group">
                                <label class="form-label">头像URL</label>
                                <input type="text" id="avatar" class="form-input" placeholder="请输入头像图片的URL">
                            </div>
                            <button type="submit" class="btn">保存更改</button>
                        </form>
                    </div>
                </div>

                <div id="change-password" class="tab-content">
                    <div class="card">
                        <h2 class="section-title">修改密码</h2>
                        <div id="password-message"></div>
                        <form id="password-form">
                            <div class="form-group">
                                <label class="form-label">原密码</label>
                                <input type="password" id="old-password" class="form-input" placeholder="请输入原密码">
                            </div>
                            <div class="form-group">
                                <label class="form-label">新密码</label>
                                <input type="password" id="new-password" class="form-input" placeholder="请输入新密码">
                            </div>
                            <div class="form-group">
                                <label class="form-label">确认新密码</label>
                                <input type="password" id="confirm-password" class="form-input" placeholder="请再次输入新密码">
                            </div>
                            <button type="submit" class="btn">修改密码</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        function getRatingClass(rating) {
            if (rating >= 2400) return 'rating-high';
            if (rating >= 1600) return 'rating-medium';
            return 'rating-low';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                element.innerHTML = '';
            }, 5000);
        }

        function switchTab(tabName) {
            // 隐藏所有标签内容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // 移除所有标签的激活状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            // 显示选中的标签内容
            document.getElementById(tabName).classList.add('active');
            // 激活选中的标签
            event.target.classList.add('active');
        }

        function updateAvatar(avatarElement, avatarUrl, handle) {
            if (avatarUrl && avatarUrl.trim() !== '') {
                // 设置背景图片
                avatarElement.style.backgroundImage = `url('${avatarUrl}')`;
                avatarElement.textContent = ''; // 清除文字
                avatarElement.style.backgroundColor = 'transparent'; // 移除背景色
            } else {
                // 没有头像URL时显示首字母
                avatarElement.style.backgroundImage = 'none';
                avatarElement.textContent = handle.charAt(0).toUpperCase();
                avatarElement.style.backgroundColor = '#3498db'; // 恢复背景色
            }
        }

        async function loadUserProfile() {
            try {
                const response = await fetch('/api/user/current');
                const result = await response.json();

                if (result.success) {
                    currentUser = result.user;
                    displayUserProfile(currentUser);
                    document.getElementById('profile-content').style.display = 'block';
                } else {
                    document.getElementById('login-prompt').style.display = 'block';
                }
            } catch (error) {
                console.error('加载用户资料失败:', error);
                document.getElementById('login-prompt').style.display = 'block';
            }
        }

        function displayUserProfile(user) {
            const avatarElement = document.getElementById('user-avatar');

            // 更新头像
            updateAvatar(avatarElement, user.avatar, user.handle);

            // 更新用户名和评分
            document.getElementById('user-handle').textContent = user.handle;
            const ratingElement = document.getElementById('user-rating');
            ratingElement.textContent = user.rating;
            ratingElement.className = getRatingClass(user.rating);

            // 更新用户信息
            const userMeta = document.getElementById('user-meta');
            userMeta.innerHTML = `
                <div class="meta-item">
                    <span class="meta-label">姓名</span>
                    <span class="meta-value">${user.name || '未设置'}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">邮箱</span>
                    <span class="meta-value">${user.email}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">等级</span>
                    <span class="meta-value">${user.rank}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">最高评分</span>
                    <span class="meta-value">${user.max_rating}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">国家</span>
                    <span class="meta-value">${user.country || '未设置'}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">城市</span>
                    <span class="meta-value">${user.city || '未设置'}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">组织</span>
                    <span class="meta-value">${user.organization || '未设置'}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">注册时间</span>
                    <span class="meta-value">${formatDate(user.registration_time)}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">最后在线</span>
                    <span class="meta-value">${formatDate(user.last_online_time)}</span>
                </div>
            `;

            // 填充表单
            document.getElementById('name').value = user.name || '';
            document.getElementById('country').value = user.country || '';
            document.getElementById('city').value = user.city || '';
            document.getElementById('organization').value = user.organization || '';
            document.getElementById('avatar').value = user.avatar || '';
        }

        // 处理个人资料表单提交
        document.getElementById('profile-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                country: document.getElementById('country').value,
                city: document.getElementById('city').value,
                organization: document.getElementById('organization').value,
                avatar: document.getElementById('avatar').value
            };

            try {
                const response = await fetch('/api/user/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('profile-message', '个人资料更新成功', 'success');
                    // 更新当前用户数据
                    if (currentUser) {
                        currentUser = {...currentUser, ...formData};
                        updateAvatar(document.getElementById('user-avatar'), formData.avatar, currentUser.handle);
                    }
                    // 重新加载用户资料
                    loadUserProfile();
                } else {
                    showMessage('profile-message', result.message, 'error');
                }
            } catch (error) {
                showMessage('profile-message', '更新失败: ' + error.message, 'error');
            }
        });

        // 处理密码修改表单提交
        document.getElementById('password-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showMessage('password-message', '新密码和确认密码不一致', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('password-message', '新密码长度至少为6位', 'error');
                return;
            }

            try {
                const response = await fetch('/api/user/change_password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('password-message', '密码修改成功', 'success');
                    document.getElementById('password-form').reset();
                } else {
                    showMessage('password-message', result.message, 'error');
                }
            } catch (error) {
                showMessage('password-message', '密码修改失败: ' + error.message, 'error');
            }
        });

        // 页面加载时获取用户资料
        document.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>
</body>
</html>
