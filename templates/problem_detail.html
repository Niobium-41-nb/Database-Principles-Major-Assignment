<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目详情 - 在线评测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css" rel="stylesheet">
    <style>
        .problem-header { background: #f8f9fa; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .tag { display: inline-block; background: #e9ecef; padding: 2px 8px; margin: 2px; border-radius: 3px; font-size: 0.9em; }
        .sample-test { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .code-block { background: #f1f3f4; padding: 10px; border-radius: 3px; font-family: monospace; white-space: pre-wrap; }
        .submit-btn { margin-top: 20px; }
        .loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Online Judge</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">首页</a>
                <a class="nav-link" href="/problems">题目列表</a>
                <a class="nav-link" href="/contests">比赛</a>
                <a class="nav-link" href="/submissions">提交记录</a>
                <a class="nav-link" href="/profile">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" id="problem-container">
        <!-- 加载中状态 -->
        <div class="loading" id="loading">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2">正在加载题目详情...</p>
        </div>

        <!-- 题目内容（动态加载） -->
        <div id="problem-content" style="display: none;">
            <!-- 题目头部信息 -->
            <div class="problem-header">
                <h1 id="problem-title">题目标题</h1>
                <div class="problem-meta">
                    <span class="badge" id="difficulty-badge">难度</span>
                    <span>时间限制: <span id="time-limit">0</span>ms</span>
                    <span>内存限制: <span id="memory-limit">0</span>KB</span>
                    <span>通过: <span id="accepted-count">0</span></span>
                    <span>提交: <span id="submission-count">0</span></span>
                </div>
                <div class="tags mt-2" id="tags-container">
                    <!-- 标签动态加载 -->
                </div>
            </div>

            <!-- 题目内容 -->
            <div class="problem-content">
                <!-- 题目描述 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">题目描述</h5>
                    </div>
                    <div class="card-body">
                        <div id="statement">题目描述加载中...</div>
                    </div>
                </div>

                <!-- 输入格式 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">输入格式</h5>
                    </div>
                    <div class="card-body">
                        <div id="input-spec">输入格式加载中...</div>
                    </div>
                </div>

                <!-- 输出格式 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">输出格式</h5>
                    </div>
                    <div class="card-body">
                        <div id="output-spec">输出格式加载中...</div>
                    </div>
                </div>

                <!-- 样例 -->
                <div class="card mb-3" id="samples-card" style="display: none;">
                    <div class="card-header">
                        <h5 class="mb-0">样例</h5>
                    </div>
                    <div class="card-body" id="samples-container">
                        <!-- 样例动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 提交区域 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">提交代码</h5>
                </div>
                <div class="card-body">
                    <form id="submit-form">
                        <div class="mb-3">
                            <label for="language" class="form-label">编程语言</label>
                            <select class="form-select" id="language" name="language">
                                <option value="C++">C++</option>
                                <option value="Java">Java</option>
                                <option value="Python">Python</option>
                                <option value="C">C</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="source-code" class="form-label">源代码</label>
                            <textarea class="form-control" id="source-code" name="source_code" rows="15"
                                      placeholder="请在此处编写你的代码..." style="font-family: 'Courier New', monospace;"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary submit-btn">提交</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 错误信息 -->
        <div class="alert alert-danger" id="error-message" style="display: none;">
            <h4>加载失败</h4>
            <p id="error-text"></p>
            <a href="/problems" class="btn btn-secondary">返回题目列表</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>
        // 页面加载时获取题目数据
        document.addEventListener('DOMContentLoaded', function() {
            const problemId = window.location.pathname.split('/').pop();
            loadProblemDetail(problemId);

            // 提交表单处理
            document.getElementById('submit-form').addEventListener('submit', function(e) {
                e.preventDefault();
                submitSolution(problemId);
            });
        });

        function loadProblemDetail(problemId) {
            fetch(`/api/problem/${problemId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayProblem(data.problem);
                    } else {
                        showError(data.message || '获取题目详情失败');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('网络错误，请稍后重试');
                });
        }

        function displayProblem(problem) {
            // 隐藏加载中，显示内容
            document.getElementById('loading').style.display = 'none';
            document.getElementById('problem-content').style.display = 'block';

            // 更新页面标题
            document.title = problem.title + ' - 在线评测系统';

            // 更新题目信息
            document.getElementById('problem-title').textContent = problem.title;
            document.getElementById('statement').innerHTML = problem.statement || '<p>暂无题目描述</p>';
            document.getElementById('input-spec').innerHTML = problem.input_specification || '<p>暂无输入格式说明</p>';
            document.getElementById('output-spec').innerHTML = problem.output_specification || '<p>暂无输出格式说明</p>';
            document.getElementById('time-limit').textContent = problem.time_limit;
            document.getElementById('memory-limit').textContent = problem.memory_limit;
            document.getElementById('accepted-count').textContent = problem.accepted_count || 0;
            document.getElementById('submission-count').textContent = problem.submission_count || 0;

            // 设置难度
            const difficultyBadge = document.getElementById('difficulty-badge');
            const colors = {
                '简单': 'bg-success',
                '中等': 'bg-warning',
                '困难': 'bg-danger',
                'Easy': 'bg-success',
                'Medium': 'bg-warning',
                'Hard': 'bg-danger'
            };
            difficultyBadge.textContent = problem.difficulty || '简单';
            difficultyBadge.className = `badge ${colors[problem.difficulty] || 'bg-secondary'}`;

            // 更新标签
            const tagsContainer = document.getElementById('tags-container');
            if (problem.tags && problem.tags.length > 0) {
                tagsContainer.innerHTML = '';
                problem.tags.forEach(tag => {
                    const tagElement = document.createElement('span');
                    tagElement.className = 'tag';
                    tagElement.textContent = tag;
                    tagsContainer.appendChild(tagElement);
                });
            } else {
                tagsContainer.innerHTML = '<span class="text-muted">暂无标签</span>';
            }

            // 更新样例
            const samplesContainer = document.getElementById('samples-container');
            const samplesCard = document.getElementById('samples-card');
            if (problem.sample_tests && problem.sample_tests.length > 0) {
                samplesCard.style.display = 'block';
                samplesContainer.innerHTML = '';

                problem.sample_tests.forEach((sample, index) => {
                    const sampleElement = document.createElement('div');
                    sampleElement.className = 'sample-test';
                    sampleElement.innerHTML = `
                        <strong>样例 ${index + 1}:</strong>
                        <div class="mt-2">
                            <strong>输入:</strong>
                            <div class="code-block">${sample.input || ''}</div>
                        </div>
                        <div class="mt-2">
                            <strong>输出:</strong>
                            <div class="code-block">${sample.output || ''}</div>
                        </div>
                    `;
                    samplesContainer.appendChild(sampleElement);
                });

                // 渲染代码高亮
                document.querySelectorAll('.code-block').forEach(block => {
                    hljs.highlightElement(block);
                });
            } else {
                samplesCard.style.display = 'none';
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-text').textContent = message;
        }

        function submitSolution(problemId) {
            const sourceCode = document.getElementById('source-code').value;
            const language = document.getElementById('language').value;

            if (!sourceCode.trim()) {
                alert('请填写代码');
                return;
            }

            fetch('/api/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    problem_id: problemId,
                    source_code: sourceCode,
                    language: language
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('提交成功！提交ID: ' + data.submission_id);
                    window.location.href = '/submissions';
                } else {
                    alert('提交失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('提交失败');
            });
        }
    </script>
</body>
</html>
