<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比赛排名 - 在线判题系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/contest_standings.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="loading" class="card">
            <p>加载排名中...</p>
        </div>

        <div id="standings-content" style="display: none;">
            <div class="card">
                <div class="header-row">
                    <h1 id="contest-title">比赛排名</h1>
                    <div>
                        <a href="#" id="contest-detail-link" class="btn btn-secondary">返回比赛详情</a>
                        <button id="refresh-standings-btn" class="btn btn-success" style="margin-left: 0.5rem;">刷新排名</button>
                    </div>
                </div>

                <div class="contest-info" id="contest-info">
                    <!-- 比赛信息将通过JavaScript动态加载 -->
                </div>

                <!-- 管理员操作 -->
                <div id="admin-actions" class="admin-actions" style="display: none;">
                    <button id="generate-standings-btn" class="btn btn-warning">重新生成排名</button>
                    <small style="color: #666; margin-left: 1rem;">注意：重新生成排名将根据提交记录重新计算</small>
                </div>
            </div>

            <div class="card">
                <div id="standings-table-container" style="overflow-x: auto;">
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th width="60">排名</th>
                                <th>用户</th>
                                <th width="100">评分</th>
                                <th width="80">解题数</th>
                                <th width="100">罚时</th>
                                <th width="100">得分</th>
                                <th width="100">Rating变化</th>
                            </tr>
                        </thead>
                        <tbody id="standings-table-body">
                            <!-- 排名数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination">
                    <!-- 分页按钮将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

        <div id="error-message" class="card" style="display: none; background: #f8d7da; color: #721c24;">
            <h2>错误</h2>
            <p id="error-text"></p>
            <a href="/contests" class="btn btn-secondary">返回比赛列表</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/contest_standings.js') }}"></script>
</body>
</html>
