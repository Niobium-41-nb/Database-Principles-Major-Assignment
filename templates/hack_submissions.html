<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>Hack提交详情</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/hack_submissions.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hack提交详情 #{{ hack_id }}</h1>
            <div class="header-info">
                <div class="info-item" id="hack-info">
                    <span class="info-label">状态</span>
                    <span class="info-value" id="hack-status">加载中...</span>
                </div>
            </div>
        </div>

        <div id="submission-list">
            <!-- 提交记录将通过JavaScript动态插入 -->
        </div>

        <a href="/hacks" class="back-button">返回Hack列表</a>
    </div>
    <script src="/static/js/hack_submissions.js"></script>
</body>
</html>
