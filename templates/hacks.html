<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>Hack记录</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/hacks.css">
</head>
<body>
    <div class="container">
        <h1>Hack记录</h1>

        <!-- 添加回到首页的按钮 -->
        <a href="/" class="nav-button">← 返回首页</a>

        <div class="filters">
            <div>
                <span class="filter-label">结果：</span>
                <select id="verdict-filter" class="filter-select">
                    <option value="">全部</option>
                    <option value="SUCCESSFUL">成功</option>
                    <option value="UNSUCCESSFUL">失败</option>
                    <option value="INVALID">无效</option>
                </select>
            </div>
        </div>

        <table class="hack-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>发起者</th>
                    <th>目标用户</th>
                    <th>题目</th>
                    <th>比赛</th>
                    <th>结果</th>
                    <th>时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="hack-list">
            </tbody>
        </table>
        </div>
        <script src="/static/js/hacks.js"></script>
    </body>
</html>
