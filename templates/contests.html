<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比赛列表 - 在线判题系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="header-row">
                <h1>比赛列表</h1>
                <div>
                    <button id="create-contest-btn" class="btn btn-success hidden">创建比赛</button>
                </div>
            </div>

            <!-- 管理员操作 -->
            <div id="admin-actions" class="admin-actions hidden">
                <button id="refresh-contests-btn" class="btn btn-warning">刷新比赛列表</button>
                <small class="admin-note">从外部API同步比赛数据</small>
            </div>

            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">比赛阶段</span>
                    <select id="phase-filter" class="filter-select">
                        <option value="">全部</option>
                        <option value="BEFORE">未开始</option>
                        <option value="CODING">进行中</option>
                        <option value="FINISHED">已结束</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">比赛类型</span>
                    <select id="type-filter" class="filter-select">
                        <option value="">全部</option>
                        <option value="CF">Codeforces式</option>
                        <option value="IOI">IOI式</option>
                        <option value="ICPC">ICPC式</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">难度</span>
                    <select id="difficulty-filter" class="filter-select">
                        <option value="">全部</option>
                        <option value="简单">简单</option>
                        <option value="中等">中等</option>
                        <option value="困难">困难</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">搜索</span>
                    <input type="text" id="search-input" class="search-box" placeholder="搜索比赛名称...">
                </div>
                <div class="filter-group filter-actions">
                    <button id="apply-filters-btn" class="btn">应用筛选</button>
                    <button id="reset-filters-btn" class="btn btn-secondary">重置</button>
                </div>
            </div>

            <div id="contests-table-container">
                <table class="contests-table">
                    <thead>
                        <tr>
                            <th width="100">比赛ID</th>
                            <th>比赛名称</th>
                            <th width="120">阶段</th>
                            <th width="120">类型</th>
                            <th width="100">难度</th>
                            <th width="180">开始时间</th>
                            <th width="180">结束时间</th>
                            <th width="100">操作</th>
                        </tr>
                    </thead>
                    <tbody id="contests-table-body">
                        <!-- 比赛数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="pagination">
                <!-- 分页按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 创建比赛模态框 -->
    <div id="create-contest-modal" class="create-contest-modal">
        <div class="create-contest-content">
            <h2 class="modal-title">创建比赛</h2>
            <form id="create-contest-form" class="create-contest-form">
                <div class="form-field">
                    <label for="contest-name">比赛名称</label>
                    <input type="text" id="contest-name" class="form-input" required>
                </div>
                <div class="form-field">
                    <label for="contest-description">比赛描述</label>
                    <textarea id="contest-description" class="form-input"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="contest-start-time">开始时间</label>
                        <input type="datetime-local" id="contest-start-time" class="form-input" required>
                    </div>
                    <div class="form-field">
                        <label for="contest-end-time">结束时间</label>
                        <input type="datetime-local" id="contest-end-time" class="form-input" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="contest-type">比赛类型</label>
                        <select id="contest-type" class="form-input" required>
                            <option value="CF">Codeforces式</option>
                            <option value="IOI">IOI式</option>
                            <option value="ICPC">ICPC式</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="contest-difficulty">难度</label>
                        <select id="contest-difficulty" class="form-input">
                            <option value="">无</option>
                            <option value="简单">简单</option>
                            <option value="中等">中等</option>
                            <option value="困难">困难</option>
                        </select>
                    </div>
                </div>
                <div class="form-field">
                    <label for="contest-kind">比赛种类</label>
                    <input type="text" id="contest-kind" class="form-input">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">创建</button>
                    <button type="button" id="cancel-create-btn" class="btn btn-secondary">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let contests = [];
        let currentPage = 1;
        const pageSize = 20;
        let filters = {
            phase: '',
            type: '',
            difficulty: '',
            search: ''
        };

        function getPhaseText(phase) {
            const phaseMap = {
                'BEFORE': '未开始',
                'CODING': '进行中',
                'PENDING_SYSTEM_TEST': '等待系统测试',
                'SYSTEM_TEST': '系统测试中',
                'FINISHED': '已结束'
            };
            return phaseMap[phase] || phase;
        }

        function getPhaseClass(phase) {
            const phaseClassMap = {
                'BEFORE': 'phase-before',
                'CODING': 'phase-coding',
                'FINISHED': 'phase-finished'
            };
            return phaseClassMap[phase] || '';
        }

        function getTypeText(type) {
            const typeMap = {
                'CF': 'Codeforces式',
                'IOI': 'IOI式',
                'ICPC': 'ICPC式'
            };
            return typeMap[type] || type;
        }

        function getDifficultyClass(difficulty) {
            if (!difficulty) return '';
            if (difficulty === '简单' || difficulty === 'Easy') return 'difficulty-easy';
            if (difficulty === '中等' || difficulty === 'Medium') return 'difficulty-medium';
            if (difficulty === '困难' || difficulty === 'Hard') return 'difficulty-hard';
            return '';
        }

        function formatDateTime(datetimeStr) {
            if (!datetimeStr) return '-';
            const date = new Date(datetimeStr);
            return date.toLocaleString('zh-CN');
        }

        async function loadContests() {
            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    page_size: pageSize,
                    ...filters
                });

                const response = await fetch(`/api/contests?${params}`);
                const result = await response.json();

                if (result.success) {
                    contests = result.contests;
                    displayContests(contests);
                    setupPagination(result.total_count);
                } else {
                    console.error('加载比赛列表失败:', result.message);
                    displayContests([]);
                }
            } catch (error) {
                console.error('加载比赛列表时发生错误:', error);
                displayContests([]);
            }
        }

        function displayContests(contests) {
            const tbody = document.getElementById('contests-table-body');

            if (!contests || contests.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            暂无比赛数据
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            contests.forEach(contest => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${contest.contest_id}</td>
                    <td>
                        <a href="/contest/${contest.contest_id}" class="contest-link">
                            ${contest.name}
                        </a>
                    </td>
                    <td class="${getPhaseClass(contest.phase)}">${getPhaseText(contest.phase)}</td>
                    <td>${getTypeText(contest.type)}</td>
                    <td class="${getDifficultyClass(contest.difficulty)}">${contest.difficulty || '-'}</td>
                    <td>${formatDateTime(contest.start_time)}</td>
                    <td>${formatDateTime(contest.end_time)}</td>
                    <td>
                        <a href="/contest/${contest.contest_id}" class="btn">查看</a>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function setupPagination(totalCount) {
            const totalPages = Math.ceil(totalCount / pageSize);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHTML = '';

            // 上一页按钮
            if (currentPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">上一页</button>`;
            }

            // 页码按钮
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) {
                    paginationHTML += `<span style="padding: 0.5rem;">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span style="padding: 0.5rem;">...</span>`;
                }
                paginationHTML += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }

            // 下一页按钮
            if (currentPage < totalPages) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">下一页</button>`;
            }

            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            loadContests();
            // 滚动到顶部
            window.scrollTo(0, 0);
        }

        function applyFilters() {
            filters = {
                phase: document.getElementById('phase-filter').value,
                type: document.getElementById('type-filter').value,
                difficulty: document.getElementById('difficulty-filter').value,
                search: document.getElementById('search-input').value.trim()
            };
            currentPage = 1;
            loadContests();
        }

        function resetFilters() {
            document.getElementById('phase-filter').value = '';
            document.getElementById('type-filter').value = '';
            document.getElementById('difficulty-filter').value = '';
            document.getElementById('search-input').value = '';
            applyFilters();
        }

        // 检查管理员权限
        async function checkAdminPermission() {
            try {
                const response = await fetch('/api/user/current');
                const result = await response.json();

                if (result.success && result.user && result.user.is_admin) {
                    document.getElementById('create-contest-btn').style.display = 'inline-block';
                    document.getElementById('admin-actions').style.display = 'block';
                }
            } catch (error) {
                console.error('检查管理员权限失败:', error);
            }
        }

        // 创建比赛
        async function createContest(contestData) {
            try {
                const response = await fetch('/api/contest/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(contestData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('比赛创建成功！');
                    hideCreateContestModal();
                    loadContests(); // 刷新列表
                } else {
                    alert('创建比赛失败: ' + result.message);
                }
            } catch (error) {
                console.error('创建比赛失败:', error);
                alert('创建比赛失败，请检查网络连接');
            }
        }

        function showCreateContestModal() {
            document.getElementById('create-contest-modal').style.display = 'block';
        }

        function hideCreateContestModal() {
            document.getElementById('create-contest-modal').style.display = 'none';
            document.getElementById('create-contest-form').reset();
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            loadContests();
            checkAdminPermission();
        });

        // 事件监听器
        document.getElementById('apply-filters-btn').addEventListener('click', applyFilters);
        document.getElementById('reset-filters-btn').addEventListener('click', resetFilters);
        document.getElementById('create-contest-btn').addEventListener('click', showCreateContestModal);
        document.getElementById('cancel-create-btn').addEventListener('click', hideCreateContestModal);
        document.getElementById('refresh-contests-btn').addEventListener('click', function() {
            if (confirm('确定要从外部API同步比赛数据吗？')) {
                refreshContestsFromAPI();
            }
        });

        // 创建比赛表单提交
        document.getElementById('create-contest-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const contestData = {
                name: document.getElementById('contest-name').value,
                description: document.getElementById('contest-description').value,
                start_time: document.getElementById('contest-start-time').value,
                end_time: document.getElementById('contest-end-time').value,
                type: document.getElementById('contest-type').value,
                difficulty: document.getElementById('contest-difficulty').value || null,
                kind: document.getElementById('contest-kind').value || null
            };

            createContest(contestData);
        });

        // 从外部API刷新比赛数据
        async function refreshContestsFromAPI() {
            try {
                const response = await fetch('/api/contests/refresh', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    alert('比赛数据刷新成功！');
                    loadContests(); // 刷新列表
                } else {
                    alert('刷新比赛数据失败: ' + result.message);
                }
            } catch (error) {
                console.error('刷新比赛数据失败:', error);
                alert('刷新比赛数据失败，请检查网络连接');
            }
        }

    </script>
</body>
</html>
