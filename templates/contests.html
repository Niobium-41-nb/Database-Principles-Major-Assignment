<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比赛列表 - 在线判题系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="header-row">
                <h1>比赛列表</h1>
                <div>
                    <button id="create-contest-btn" class="btn btn-success hidden">创建比赛</button>
                </div>
            </div>

            <!-- 管理员操作 -->
            <div id="admin-actions" class="admin-actions hidden">
                <button id="refresh-contests-btn" class="btn btn-warning">刷新比赛列表</button>
                <small class="admin-note">从外部API同步比赛数据</small>
            </div>

            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">比赛阶段</span>
                    <select id="phase-filter" class="filter-select">
                        <option value="">全部</option>
                        <option value="BEFORE">未开始</option>
                        <option value="CODING">进行中</option>
                        <option value="FINISHED">已结束</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">比赛类型</span>
                    <select id="type-filter" class="filter-select">
                        <option value="">全部</option>
                        <option value="CF">Codeforces式</option>
                        <option value="IOI">IOI式</option>
                        <option value="ICPC">ICPC式</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">难度</span>
                    <select id="difficulty-filter" class="filter-select">
                        <option value="">全部</option>
                        <option value="简单">简单</option>
                        <option value="中等">中等</option>
                        <option value="困难">困难</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">搜索</span>
                    <input type="text" id="search-input" class="search-box" placeholder="搜索比赛名称...">
                </div>
                <div class="filter-group filter-actions">
                    <button id="apply-filters-btn" class="btn">应用筛选</button>
                    <button id="reset-filters-btn" class="btn btn-secondary">重置</button>
                </div>
            </div>

            <div id="contests-table-container">
                <table class="contests-table">
                    <thead>
                        <tr>
                            <th width="100">比赛ID</th>
                            <th>比赛名称</th>
                            <th width="120">阶段</th>
                            <th width="120">类型</th>
                            <th width="100">难度</th>
                            <th width="180">开始时间</th>
                            <th width="180">结束时间</th>
                            <th width="100">操作</th>
                        </tr>
                    </thead>
                    <tbody id="contests-table-body">
                        <!-- 比赛数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="pagination">
                <!-- 分页按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 创建比赛模态框 -->
    <div id="create-contest-modal" class="create-contest-modal">
        <div class="create-contest-content">
            <h2 class="modal-title">创建比赛</h2>
            <form id="create-contest-form" class="create-contest-form">
                <div class="form-field">
                    <label for="contest-name">比赛名称</label>
                    <input type="text" id="contest-name" class="form-input" required>
                </div>
                <div class="form-field">
                    <label for="contest-description">比赛描述</label>
                    <textarea id="contest-description" class="form-input"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="contest-start-time">开始时间</label>
                        <input type="datetime-local" id="contest-start-time" class="form-input" required>
                    </div>
                    <div class="form-field">
                        <label for="contest-end-time">结束时间</label>
                        <input type="datetime-local" id="contest-end-time" class="form-input" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="contest-type">比赛类型</label>
                        <select id="contest-type" class="form-input" required>
                            <option value="CF">Codeforces式</option>
                            <option value="IOI">IOI式</option>
                            <option value="ICPC">ICPC式</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="contest-difficulty">难度</label>
                        <select id="contest-difficulty" class="form-input">
                            <option value="">无</option>
                            <option value="简单">简单</option>
                            <option value="中等">中等</option>
                            <option value="困难">困难</option>
                        </select>
                    </div>
                </div>
                <div class="form-field">
                    <label for="contest-kind">比赛种类</label>
                    <input type="text" id="contest-kind" class="form-input">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">创建</button>
                    <button type="button" id="cancel-create-btn" class="btn btn-secondary">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/contests.js') }}"></script>
</body>
</html>
