<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比赛详情 - 在线判题系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/contest_detail.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="loading" class="card">
            <p>加载中...</p>
        </div>

        <div id="contest-content" style="display: none;">
            <div class="card">
                <div class="contest-header">
                    <h1 id="contest-title" class="contest-title">比赛标题</h1>
                    <div id="countdown" class="countdown" style="display: none;">
                        <div class="meta-label">剩余时间</div>
                        <div id="countdown-timer" class="countdown-timer">--:--:--</div>
                    </div>
                    <div class="header-actions">
                        <a href="#" id="standings-link" class="btn">查看排名</a>
                        <a href="/contests" class="btn btn-secondary">返回列表</a>
                        <button id="register-btn" class="btn btn-success" style="display: none;">报名参赛</button>
                        <button id="enter-btn" class="btn btn-success" style="display: none;">进入比赛</button>
                    </div>
                </div>

                <div class="contest-meta" id="contest-meta">
                    <!-- 比赛信息将通过JavaScript动态加载 -->
                </div>

                <div id="contest-description">
                    <!-- 比赛描述将通过JavaScript动态加载 -->
                </div>
            </div>

            <!-- 管理员面板 -->
            <div id="admin-panel" class="card" style="display: none;">
                <h2 class="section-title">题目管理</h2>

                <div class="admin-actions">
                    <button id="manage-problems-btn" class="btn btn-primary">管理题目</button>
                    <button id="generate-standings-btn" class="btn btn-warning">生成排名</button>
                    <button id="refresh-problems-btn" class="btn btn-secondary">刷新题目列表</button>
                </div>

                <!-- 添加题目表单 -->
                <div id="add-problem-form" style="display: none; background: #f8f9fa; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                    <h3>添加题目到比赛</h3>
                    <div style="display: grid; grid-template-columns: 1fr auto auto; gap: 0.5rem; align-items: end;">
                        <div>
                            <label style="display: block; margin-bottom: 0.25rem; font-weight: bold;">选择题目</label>
                            <select id="problem-select" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="">请选择题目</option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.25rem; font-weight: bold;">题目索引</label>
                            <input type="text" id="problem-index" placeholder="A"
                                   style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; width: 80px;"
                                   maxlength="2" value="A">
                        </div>
                        <div>
                            <button id="add-problem-btn" class="btn btn-success">添加</button>
                            <button id="cancel-add-btn" class="btn btn-secondary">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 当前比赛题目列表 -->
                <div id="contest-problems-admin">
                    <h3>当前比赛题目</h3>
                    <table class="problems-table">
                        <thead>
                            <tr>
                                <th width="80">索引</th>
                                <th width="100">题目ID</th>
                                <th>标题</th>
                                <th width="100">难度</th>
                                <th width="100">操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-problems-table-body">
                            <!-- 管理员视角的题目列表 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">比赛题目</h2>
                <div id="problems-list">
                    <table class="problems-table">
                        <thead>
                            <tr>
                                <th width="100">题目ID</th>
                                <th>标题</th>
                                <th width="100">难度</th>
                                <th width="120">时间限制</th>
                                <th width="120">内存限制</th>
                            </tr>
                        </thead>
                        <tbody id="problems-table-body">
                            <!-- 题目数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="error-message" class="card" style="display: none; background: #f8d7da; color: #721c24;">
            <h2>错误</h2>
            <p id="error-text"></p>
            <a href="/contests" class="btn btn-secondary">返回比赛列表</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/contest_detail.js') }}"></script>
</body>
</html>
