<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线判题系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>在线判题系统</h1>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/problems">题目</a>
                <a href="/contests">比赛</a>
                <a href="/submissions">提交记录</a>
                <a href="/users">用户</a>
                <a href="/profile" id="profile-link">个人资料</a>
                   <a href="/hacks">Hack记录</a>
                <div id="auth-buttons">
                    <div id="user-info" class="user-info">
                        <span id="user-handle" class="user-handle"></span>
                        <button onclick="logout()">登出</button>
                    </div>
                    <div id="guest-buttons" class="guest-buttons">
                        <button onclick="showLogin()">登录</button>
                        <button onclick="showRegister()">注册</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>欢迎来到在线判题系统</h2>
            <p>这是一个模仿 Codeforces 的在线编程评测平台</p>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div id="login-modal" class="auth-modal">
        <div class="auth-content">
            <h3>登录</h3>
            <input type="text" id="login-handle" placeholder="用户名" class="auth-input">
            <input type="password" id="login-password" placeholder="密码" class="auth-input">
            <button onclick="login()" class="btn">登录</button>
            <button onclick="hideLogin()" class="btn btn-secondary">取消</button>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div id="register-modal" class="auth-modal">
        <div class="auth-content">
            <h3>注册</h3>
            <input type="text" id="register-handle" placeholder="用户名" class="auth-input">
            <input type="email" id="register-email" placeholder="邮箱" class="auth-input">
            <input type="password" id="register-password" placeholder="密码" class="auth-input">
            <input type="text" id="register-name" placeholder="姓名（可选）" class="auth-input">
            <button onclick="register()" class="btn">注册</button>
            <button onclick="hideRegister()" class="btn btn-secondary">取消</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
